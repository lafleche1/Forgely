name: Python checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra python3-tk xvfb
          python -m pip install -r requirements-dev.txt
      - name: Validate packaged Dofocus reference
        run: python -m pytest -q Application/tests/test_dofocus_store.py
      - name: Compile Python sources
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files = [p for p in pathlib.Path('.').rglob('*.py') if '.venv' not in p.parts]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'Compiled {len(files)} Python files')
          PY
      - name: Run regression tests
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python -m pytest -q
      - name: Verify native Tk dashboard
        env:
          FORGELY_GUI_TESTS: '1'
          LOCALAPPDATA: ${{ runner.temp }}/forgely-ui
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python -m pytest -q Application/tests/test_dashboard_tk.py

